@if (tab(); as tab) {
  <nol-browser-toolbar [controller]="tab.controller" [openLink]="openLink" [noticeId]="noticeId" [refusalId]="stateHeadingId" [shownAddress]="refusedAddress()" (addressEntered)="goTo(tab, $event)" (entryLeft)="leaveEntry(tab)" (clearBrowsingData)="clearBrowsingData(tab)"
    (findRequested)="openFind(tab)" />
  @if (isFinding()) {
    <nol-browser-find-bar [controller]="tab.controller" (closed)="closeFind()" />
  }
}
@if (activity(); as activity) {
  <nol-browser-agent-bar [activity]="activity" (tookOver)="stopAgent(true)" (stopped)="stopAgent(false)" />
}
<div class="nol-browser-page-area" [id]="pageId" [attr.aria-busy]="isLoading() || null">
  @if (tab(); as tab) {
    <nol-browser-request-notice [controller]="tab.controller" [messageId]="noticeId" [appName]="appName()" (focusLeaving)="focusToolbar()" (popupOpened)="openPopup(tab, $event)"
      (externalOpened)="openExternal($event)" />
  }
  <div #view class="nol-browser-page-view">
    @if (isElsewhere()) {
      <nol-browser-page-state [isElsewhere]="true" (closed)="close()" />
    } @else if (isForgotten()) {
      <nol-browser-page-state [isForgotten]="true" [appName]="appName()" (closed)="close()" />
    } @else if (tab(); as tab) {
      @if (placedTab() === null) {
        <nol-browser-page-state [controller]="tab.controller" [refusal]="refusal()" [appName]="appName()" [headingId]="stateHeadingId" (focusLeaving)="focusToolbar()"
          (refusalAnswered)="answerRefusal(tab, $event)" />
      }
    }
  </div>
</div>
