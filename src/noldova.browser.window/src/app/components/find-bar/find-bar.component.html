<nol-text-field-box class="nol-browser-find-field" [icon]="resources.findGlyph">
  <input #field nol-text-field type="text" spellcheck="false" autocomplete="off" [attr.aria-label]="resources.findField"
    [attr.aria-describedby]="countText() === null ? null : countId" (input)="edit()">
  @if (countText(); as count) {
    <span nolTextFieldEnd class="nol-browser-find-count" [id]="countId">{{ count }}</span>
  }
</nol-text-field-box>
<div class="nol-browser-find-buttons">
  <button nol-toolbar-button type="button" [label]="resources.previousMatch" [icon]="resources.previousMatchGlyph" [isUnavailable]="!hasMatches()"
    [nolTooltip]="resources.previousMatch" [nolTooltipSide]="below" (click)="goPrevious()"></button>
  <button nol-toolbar-button type="button" [label]="resources.nextMatch" [icon]="resources.nextMatchGlyph" [isUnavailable]="!hasMatches()"
    [nolTooltip]="resources.nextMatch" [nolTooltipSide]="below" (click)="goNext()"></button>
  <button nol-toolbar-button type="button" [label]="resources.closeFind" [icon]="resources.closeFindGlyph" [nolTooltip]="resources.closeFind" [nolTooltipSide]="below"
    (click)="close()"></button>
</div>
