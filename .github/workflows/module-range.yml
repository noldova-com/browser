name: Module range

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  module-range:
    name: Module range
    uses: noldova-com/desktop/.github/workflows/module-range.yml@bf279a5a87675f94fc691da07bf095cd8544540d # desktop#41 trial
    permissions:
      contents: read
      issues: write
    with:
      module: src/noldova.browser
      build: npm run peers:newest && npm run build
